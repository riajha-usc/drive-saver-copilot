# Render blueprint. The same image runs on Railway, Fly.io or Cloud Run;
# see the deployment section of the README for those.
services:
  - type: web
    name: drive-saver-copilot-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    # The telemetry store is in process, so uploads are not shared between
    # instances. Keep this at 1 until that store moves to a database.
    numInstances: 1
    envVars:
      - key: DSC_CORS_ORIGINS
        sync: false          # set to the dashboard's real origin before going live
      - key: ANTHROPIC_API_KEY
        sync: false          # optional; without it the deterministic narrator runs
      - key: DSC_SEED_SAMPLE
        value: "1"
